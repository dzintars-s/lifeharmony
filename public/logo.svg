<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="forestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4A3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3A2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C4A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8A582;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="champagneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DFD0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C4A8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4C4A8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#B8A582;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="100" cy="100" r="98" fill="url(#glowGradient)" opacity="0.5" />

  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.9" />

  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#forestGradient)" />

  <!-- Water ripple effect (outer) -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#champagneGradient)" stroke-width="1" opacity="0.4" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#champagneGradient)" stroke-width="0.8" opacity="0.2" />

  <!-- Lotus petals (8 petals in circle) -->
  <g id="petals">
    <!-- Petal 1 - Top -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.95" />

    <!-- Petal 2 - Top-Right -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.9" transform="rotate(45 100 100)" />

    <!-- Petal 3 - Right -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.85" transform="rotate(90 100 100)" />

    <!-- Petal 4 - Bottom-Right -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.8" transform="rotate(135 100 100)" />

    <!-- Petal 5 - Bottom -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.9" transform="rotate(180 100 100)" />

    <!-- Petal 6 - Bottom-Left -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.85" transform="rotate(225 100 100)" />

    <!-- Petal 7 - Left -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.8" transform="rotate(270 100 100)" />

    <!-- Petal 8 - Top-Left -->
    <path d="M 100 30 Q 85 50 82 70 Q 80 85 100 92 Q 120 85 118 70 Q 115 50 100 30"
          fill="url(#champagneGradient)" opacity="0.9" transform="rotate(315 100 100)" />
  </g>

  <!-- Inner lotus center - darker background -->
  <circle cx="100" cy="100" r="32" fill="rgba(26, 58, 42, 0.3)" />

  <!-- Inner lotus petals (smaller) -->
  <g id="inner-petals">
    <!-- Inner petal 1 -->
    <path d="M 100 75 Q 92 82 90 90 Q 89 95 100 100 Q 111 95 110 90 Q 108 82 100 75"
          fill="url(#goldGradient)" opacity="0.95" />

    <!-- Inner petal 2 -->
    <path d="M 100 75 Q 92 82 90 90 Q 89 95 100 100 Q 111 95 110 90 Q 108 82 100 75"
          fill="url(#goldGradient)" opacity="0.9" transform="rotate(90 100 100)" />

    <!-- Inner petal 3 -->
    <path d="M 100 75 Q 92 82 90 90 Q 89 95 100 100 Q 111 95 110 90 Q 108 82 100 75"
          fill="url(#goldGradient)" opacity="0.85" transform="rotate(180 100 100)" />

    <!-- Inner petal 4 -->
    <path d="M 100 75 Q 92 82 90 90 Q 89 95 100 100 Q 111 95 110 90 Q 108 82 100 75"
          fill="url(#goldGradient)" opacity="0.9" transform="rotate(270 100 100)" />
  </g>

  <!-- Center stamen -->
  <circle cx="100" cy="100" r="8" fill="url(#goldGradient)" opacity="0.95" />
  <circle cx="100" cy="100" r="6" fill="url(#champagneGradient)" opacity="0.8" />

  <!-- Subtle shine highlight -->
  <ellipse cx="88" cy="88" rx="12" ry="12" fill="white" opacity="0.12" />

  <!-- Decorative dots around center -->
  <circle cx="100" cy="75" r="1.5" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="125" cy="100" r="1.5" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="100" cy="125" r="1.5" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="75" cy="100" r="1.5" fill="url(#goldGradient)" opacity="0.6" />
</svg>